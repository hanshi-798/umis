[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umis-sentinel"
version = "1.3.0"
description = "Input-side prompt injection inspection for images and audio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "Pillow>=10", "scipy>=1.10", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
audio = ["faster-whisper>=1,<2", "soundfile>=0.12", "librosa>=0.10", "silero-vad>=5"]
encoder = ["torch>=2.2", "transformers>=4.51,<6", "accelerate>=0.30", "safetensors>=0.4", "laion-clap>=1.1", "librosa>=0.10", "soundfile>=0.12"]
judge = ["openai>=1.30,<3"]
bench = ["qrcode>=7.4", "piexif>=1.1.3", "mutagen>=1.47", "soundfile>=0.12", "edge-tts>=6", "opencv-python-headless>=4.8"]
targets = ["torch>=2.2", "transformers>=4.51,<6", "accelerate>=0.30", "openai>=1.30,<3", "qwen-omni-utils", "soundfile>=0.12"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "build>=1.2", "wheel"]

[project.scripts]
umis = "umis.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["umis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code", "."]
